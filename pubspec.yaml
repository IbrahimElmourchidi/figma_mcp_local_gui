name: figma_local_mcp_gui
description: "A GUI manager for Figma MCP Local Bridge Server"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  http: ^1.2.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  archive: ^4.2.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/plugins/
    - assets/bundled/

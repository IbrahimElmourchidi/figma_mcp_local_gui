name: App Release

on:
  push:
    tags:
      - 'v*'

jobs:
  guard:
    name: Guard Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec.yaml
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $1}' | cut -d'+' -f1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "error: tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG.md has section
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if ! grep -q "## $TAG" CHANGELOG.md; then
            echo "error: CHANGELOG.md missing section for $TAG"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_cmd: flutter build linux --release
            artifact: build/linux/x64/release/bundle
            package_cmd: tar -czf figma_mcp_gui-${{ github.ref_name }}-linux-x64.tar.gz -C $ARTIFACT_DIR .
          - os: windows-latest
            platform: windows
            build_cmd: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            package_cmd: 7z a figma_mcp_gui-${{ github.ref_name }}-windows-x64.zip $ARTIFACT_DIR/*
          - os: macos-14
            platform: macos
            build_cmd: flutter build macos --release
            artifact: build/macos/Build/Products/Release
            package_cmd: |
              cd $ARTIFACT_DIR
              zip -r figma_mcp_gui-${{ github.ref_name }}-macos-arm64.zip figma_local_mcp_gui.app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Package
        run: ${{ matrix.package_cmd }}
        env:
          ARTIFACT_DIR: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: figma_mcp_gui-${{ github.ref_name }}-${{ matrix.platform }}-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          find . -name 'figma_mcp_gui-*' -type f -exec sha256sum {} \; > SHA256SUMS

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract section between this tag and the next ## heading
          awk "/^## $TAG/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md > release_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_body.txt
          files: |
            linux/figma_mcp_gui-*
            windows/figma_mcp_gui-*
            macos/figma_mcp_gui-*
            SHA256SUMS
          draft: false
          prerelease: false
